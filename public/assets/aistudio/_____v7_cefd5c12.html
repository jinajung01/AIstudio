<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>참가 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --ink:#1C2B24; --muted:#5E6D65;
  --line:#CBD5CE; --accent:#2E6B4F; --accent-ink:#FFFFFF; --stub:#F7E9B8; --danger:#A33A2B;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A16; --surface:#1B2620; --ink:#E6EDE8; --muted:#9AAAA1;
    --line:#2F3D35; --accent:#6FC29A; --accent-ink:#0E1712; --stub:#3A3420; --danger:#E3826F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A16; --surface:#1B2620; --ink:#E6EDE8; --muted:#9AAAA1;
  --line:#2F3D35; --accent:#6FC29A; --accent-ink:#0E1712; --stub:#3A3420; --danger:#E3826F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:40px 20px 64px}
main.wide{max-width:1040px}
h1{font-size:2rem;line-height:1.25;margin:0 0 8px;font-weight:700;letter-spacing:-0.02em}
.lead{color:var(--muted);margin:0 0 32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
label{display:block;font-weight:500;margin:0 0 6px}
.req{color:var(--danger);margin-left:2px}
.field{margin-bottom:18px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:11px 12px}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:auto;margin-top:5px}
.count{text-align:right;color:var(--muted);font-size:.85rem;margin-top:4px}
.err{color:var(--danger);font-size:.9rem;margin-top:6px;min-height:0}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:13px 18px;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-ink);width:100%}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row button{flex:1}
.notice{padding:14px 16px;border-radius:10px;background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
/* 접수증 */
.ticket{display:grid;grid-template-columns:1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ticket .body{padding:22px 24px}
.ticket .stub{background:var(--stub);padding:22px 18px;border-left:2px dashed var(--line);
  display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:110px}
.stub small{color:var(--muted);font-size:.8rem}
.stub strong{font-size:1.6rem;letter-spacing:.04em}
.ticket h2{margin:0 0 12px;font-size:1.25rem}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
dt{color:var(--muted)} dd{margin:0;word-break:break-all}
@media (prefers-reduced-motion:no-preference){
  .ticket.new{animation:print .5s ease-out}
  @keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
}
/* 관리자 */
.admin{margin-top:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 28px}
.tabs button{background:transparent;color:var(--muted);border-radius:8px 8px 0 0;padding:10px 16px;font-weight:500;
  border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.badge{background:var(--line);color:var(--ink);border-radius:999px;font-size:.75rem;padding:1px 8px;min-width:22px;text-align:center}
.tabs button[aria-selected="true"] .badge{background:var(--accent);color:var(--accent-ink)}
.admin h2{font-size:1.25rem;margin:0 0 4px}
.admin p{margin:0 0 16px;color:var(--muted)}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
/* 명단: 가로 스크롤 없이 한 번에 보기 */
#adminView .table-wrap{overflow-x:visible}
#adminView td{word-break:break-all}
#adminView td.nowrap{white-space:nowrap;word-break:normal}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td button{padding:6px 10px;font-weight:500;font-size:.85rem}
/* 좁은 화면: 표 대신 카드 목록 */
@media (max-width:760px){
  #adminView table, #adminView tbody, #adminView tr, #adminView td{display:block;width:100%}
  #adminView thead{display:none}
  #adminView tr{padding:12px 14px;border-bottom:1px solid var(--line)}
  #adminView tr:last-child{border-bottom:0}
  #adminView td{border:0;padding:3px 0;display:grid;grid-template-columns:76px 1fr;gap:8px}
  #adminView td::before{content:attr(data-label);color:var(--muted);font-size:.85rem}
  #adminView td.empty{display:block;text-align:center}
  #adminView td.empty::before{content:none}
  #adminView td.actcell{grid-template-columns:1fr;padding-top:8px}
  #adminView td.actcell::before{content:none}
}
@media (max-width:480px){
  .ticket{grid-template-columns:1fr}
  .ticket .stub{border-left:0;border-top:2px dashed var(--line);flex-direction:row;gap:10px}
}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:24px;width:min(360px,calc(100% - 40px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog p{margin:0 0 20px;font-size:1.02rem}
[hidden]{display:none!important}
/* v4 추가 */
dialog.wide{width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto}
dialog h3{margin:0 0 16px;font-size:1.15rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.toolbar input{flex:1 1 180px;width:auto}
.toolbar button{padding:10px 14px}
.small{padding:6px 10px;font-weight:500;font-size:.85rem}
td .acts{display:flex;gap:6px;flex-wrap:nowrap}
.lock{max-width:380px;margin:24px auto 0;text-align:center}
.lock .icon{font-size:2rem;line-height:1;margin-bottom:8px}
.lock p{color:var(--muted);margin:0 0 18px}
.lock input{text-align:center;letter-spacing:.2em;margin-bottom:12px}
.adminHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.crud{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.crud span{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.masked{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <h1>참가 신청</h1>
  <nav class="tabs" role="tablist" aria-label="화면 선택">
    <button type="button" role="tab" id="tabBtnApply" aria-controls="tabApply" aria-selected="true">신청하기</button>
    <button type="button" role="tab" id="tabBtnAdmin" aria-controls="tabAdmin" aria-selected="false">관리자 🔒</button>
  </nav>

  <!-- 신청하기 탭 -->
  <div id="tabApply" role="tabpanel" aria-labelledby="tabBtnApply">
    <p class="lead">아래 내용을 입력하고 신청하세요.</p>
    <div id="applyForm" class="card" data-enter="submit">
      <div data-fields="a"></div>
      <button id="submit" class="primary" type="button">신청하기</button>
      <div class="row" id="editRow" hidden><button type="button" class="ghost" id="cancelEdit">수정 취소</button></div>
    </div>

    <section id="done" hidden aria-live="polite">
      <div class="ticket" id="ticket">
        <div class="body">
          <h2>신청이 접수되었습니다</h2>
          <dl id="summary"></dl>
        </div>
        <div class="stub"><small>접수 번호</small><strong id="code"></strong></div>
      </div>
      <div class="row">
        <button type="button" class="ghost" id="edit">내용 수정</button>
        <button type="button" class="danger" id="withdraw">신청 취소</button>
      </div>
      <div class="row"><button type="button" class="primary" id="another">새 신청서 작성</button></div>
    </section>
  </div>

  <!-- 관리자 탭 -->
  <div id="tabAdmin" role="tabpanel" aria-labelledby="tabBtnAdmin" hidden>
    <div id="lockView" class="card lock" data-enter="pwBtn">
      <div class="icon" aria-hidden="true">🔒</div>
      <h2 style="margin:0 0 6px;font-size:1.2rem">관리자 전용</h2>
      <p>비밀번호를 입력해야 신청 명단을 볼 수 있습니다.</p>
      <input id="pw" aria-label="관리자 비밀번호" type="password" autocomplete="current-password" placeholder="비밀번호">
      <button class="primary" type="button" id="pwBtn">입장</button>
    </div>

    <section id="adminView" class="admin" hidden>
      <div class="adminHead">
        <h2>신청 명단</h2>
        <button type="button" class="ghost small" id="lockBtn">🔒 잠금</button>
      </div>
      <p id="listInfo"></p>
      <div class="toolbar">
        <input id="search" type="search" placeholder="이름·연락처·이메일·접수 번호 검색">
        <button type="button" class="primary" id="addBtn" style="width:auto">+ 신청 추가</button>
        <button type="button" class="ghost" id="csvBtn">⬇ CSV 전체 다운로드</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>No</th><th>접수 번호</th><th>이름</th><th>연락처</th><th>이메일</th><th>희망 일정</th><th>신청 시각</th><th>관리</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="row"><button type="button" class="danger" id="clearAll">명단 전체 삭제</button></div>
    </section>
  </div>

  <!-- 상세 보기 (R) -->
  <dialog id="viewDlg" class="wide" aria-labelledby="viewTitle">
    <h3 id="viewTitle">신청 상세</h3>
    <dl id="viewBody"></dl>
    <div class="row">
      <button type="button" class="ghost" id="revealBtn">개인정보 보기</button>
      <button type="button" class="ghost" id="viewEdit">수정</button>
    </div>
    <div class="row"><button type="button" class="primary" data-close="viewDlg">닫기</button></div>
  </dialog>

  <!-- 추가·수정 (C·U) -->
  <dialog id="editDlg" class="wide" aria-labelledby="editTitle">
    <div id="editForm" data-enter="editSave">
      <h3 id="editTitle">신청 추가</h3>
      <div data-fields="m"></div>
      <div class="row">
        <button type="button" class="ghost" id="editCancel">취소</button>
        <button type="button" class="primary" id="editSave" style="flex:1">저장</button>
      </div>
    </div>
  </dialog>

  <!-- 안내 팝업 -->
  <dialog id="popup" aria-labelledby="popupMsg">
    <p id="popupMsg"></p>
    <div><button type="button" class="primary" id="popupOk" data-close="popup">확인</button></div>
  </dialog>
  <!-- 예/아니요 팝업 -->
  <dialog id="ask" aria-labelledby="askMsg">
    <p id="askMsg"></p>
    <div class="row" style="margin-top:0">
      <button type="button" class="ghost" data-close="ask" data-value="no">아니요</button>
      <button type="button" class="danger" data-close="ask" data-value="yes">예</button>
    </div>
  </dialog>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const show = (el, on) => { el.hidden = !on; };

  /* ───────── 설정 ───────── */
  // 관리자 비밀번호는 원문 대신 SHA-256 해시로 보관
  const ADMIN_PW_HASH = "41c991eb6a66242c0454191244278183ce58cf4a6bcd372f799e4b9cc01886af";
  const MAX_FAIL = 5, LOCK_MS = 30000;
  const SLOTS = ["1회차 · 평일 오전", "2회차 · 평일 저녁", "3회차 · 주말 오후"];
  const STORE_KEY = "signup.applications.v1";

  const MSG = {
    nameEmpty: "이름을 입력하세요.",
    nameChar: "이름은 한글 또는 영어로 입력하세요.",
    nameMax: "최대 10자입니다.",
    phone: "연락처를 000-0000-0000 형식으로 입력하세요. 예: 010-1234-5678",
    phoneDup: "이미 신청된 연락처입니다.",
    email: "올바르지 않은 이메일 형식입니다.",
    emailDup: "이미 신청된 이메일입니다.",
    slot: "희망 일정을 선택하세요.",
    memoMax: "최대 100자입니다.",
    agree: "개인정보 수집에 동의해야 신청할 수 있습니다.",
  };

  /* ───────── SHA-256 (모든 환경에서 동작하도록 직접 구현) ───────── */
  function sha256(str) {
    const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    const bytes = new TextEncoder().encode(str);
    const len = bytes.length, bitLen = len * 8;
    const total = ((len + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(total); buf.set(bytes); buf[len] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(total - 4, bitLen >>> 0); dv.setUint32(total - 8, Math.floor(bitLen / 2 ** 32));
    let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const w = new Uint32Array(64), rotr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < total; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
        const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      let [a,b,c,d,e,f,g,hh] = h;
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (rotr(e,6) ^ rotr(e,11) ^ rotr(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
        const t2 = ((rotr(a,2) ^ rotr(a,13) ^ rotr(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      h = h.map((v, i) => (v + [a,b,c,d,e,f,g,hh][i]) >>> 0);
    }
    return h.map(v => v.toString(16).padStart(8, "0")).join("");
  }

  /* ───────── 개인정보 가림(마스킹) ───────── */
  function maskName(n) {
    const c = [...(n || "")];
    if (c.length <= 1) return "*";
    if (c.length === 2) return c[0] + "*";
    return c[0] + "*".repeat(c.length - 2) + c[c.length - 1];
  }
  const maskPhone = p => (p || "").replace(/^(\d{3})-\d{4}-(\d{4})$/, "$1-****-$2");
  function maskEmail(e) {
    const [id, dom] = (e || "").split("@");
    if (!dom) return "***";
    return (id.length <= 2 ? id[0] : id.slice(0, 2)) + "***@" + dom;
  }

  /* ───────── 브라우저 임시 저장소(localStorage) ───────── */
  let storageOk = true;
  function loadList() {
    try { const v = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); return Array.isArray(v) ? v : []; }
    catch { storageOk = false; return []; }
  }
  function saveList(list) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); return true; }
    catch { storageOk = false; return false; }
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const newCode = list => { let c; do { c = Math.random().toString(36).slice(2, 8).toUpperCase().padEnd(6, "0"); } while (list.some(x => x.code === c)); return c; };
  const fmt = iso => { try { return new Date(iso).toLocaleString("ko-KR", { dateStyle: "short", timeStyle: "short" }); } catch { return ""; } };

  /* ───────── 팝업 ───────── */
  let focusAfter = null;
  function popup(msg, focusEl) {
    focusAfter = focusEl || null;
    $("popupMsg").textContent = msg;
    if (!$("popup").open) $("popup").showModal();
  }
  $("popup").addEventListener("close", () => { if (focusAfter) focusAfter.focus(); focusAfter = null; });
  function ask(msg) {
    const d = $("ask"); $("askMsg").textContent = msg; d.returnValue = "";
    return new Promise(res => { d.addEventListener("close", () => res(d.returnValue === "yes"), { once: true }); d.showModal(); });
  }

  /* ───────── 입력 항목 (신청서·관리자 수정에서 공통 사용) ───────── */
  function fieldsHTML(p, agreeText) {
    return `
      <div class="field"><label for="${p}-name">이름<span class="req">*</span></label>
        <input id="${p}-name" autocomplete="off" placeholder="한글 또는 영어, 10자 이내"></div>
      <div class="field"><label for="${p}-phone">연락처<span class="req">*</span></label>
        <input id="${p}-phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="010-0000-0000" maxlength="13"></div>
      <div class="field"><label for="${p}-email">이메일<span class="req">*</span></label>
        <input id="${p}-email" type="email" autocomplete="off" maxlength="80"></div>
      <div class="field"><label for="${p}-slot">희망 일정<span class="req">*</span></label>
        <select id="${p}-slot"><option value="">선택하세요</option>${SLOTS.map(s => `<option>${s}</option>`).join("")}</select></div>
      <div class="field"><label for="${p}-memo">남기실 말</label>
        <textarea id="${p}-memo" placeholder="문의하실 내용이 있으면 100자 이내로 적어 주세요."></textarea>
        <div class="count" id="${p}-memoCount">0 / 100</div></div>
      <div class="field"><label class="check"><input id="${p}-agree" type="checkbox"> ${agreeText}<span class="req">*</span></label></div>`;
  }
  document.querySelector('[data-fields="a"]').innerHTML = fieldsHTML("a", "신청 확인 연락을 위해 개인정보를 수집하는 데 동의합니다.");
  document.querySelector('[data-fields="m"]').innerHTML = fieldsHTML("m", "신청자에게 개인정보 수집 동의를 받았습니다.");

  function bindFields(p) {
    const f = k => $(`${p}-${k}`);
    // 이름: 영어·한글만, 숫자·공백·기호 불가, 최대 10자
    const cleanName = () => {
      const v = f("name").value.replace(/[^a-zA-Z가-힣ㄱ-ㅎㅏ-ㅣ]/g, "");
      f("name").value = [...v].slice(0, 10).join("");
      if ([...v].length > 10) popup(MSG.nameMax, f("name"));
    };
    f("name").addEventListener("input", e => { if (!e.isComposing) cleanName(); });
    f("name").addEventListener("compositionend", cleanName);
    // 연락처: 숫자만, 자동 하이픈
    f("phone").addEventListener("input", e => {
      const d = e.target.value.replace(/\D/g, "").slice(0, 11);
      e.target.value = d.length > 7 ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}` : d.length > 3 ? `${d.slice(0,3)}-${d.slice(3)}` : d;
    });
    // 이메일: 공백 불가
    f("email").addEventListener("input", e => { if (!e.isComposing && /\s/.test(e.target.value)) e.target.value = e.target.value.replace(/\s/g, ""); });
    // 남기실 말: 최대 100자
    const count = () => { f("memoCount").textContent = `${[...f("memo").value].length} / 100`; };
    const cleanMemo = () => {
      const c = [...f("memo").value];
      if (c.length > 100) { f("memo").value = c.slice(0, 100).join(""); popup(MSG.memoMax, f("memo")); }
      count();
    };
    f("memo").addEventListener("input", e => { if (e.isComposing) count(); else cleanMemo(); });
    f("memo").addEventListener("compositionend", cleanMemo);
  }
  bindFields("a"); bindFields("m");

  function fillFields(p, d) {
    const f = k => $(`${p}-${k}`);
    f("name").value = d?.name || ""; f("phone").value = d?.phone || ""; f("email").value = d?.email || "";
    f("slot").value = d?.slot || ""; f("memo").value = d?.memo || ""; f("agree").checked = !!d;
    f("memoCount").textContent = `${[...f("memo").value].length} / 100`;
  }
  function readFields(p) {
    const f = k => $(`${p}-${k}`);
    return { name: f("name").value, phone: f("phone").value, email: f("email").value,
             slot: f("slot").value, memo: f("memo").value.trim(), agree: f("agree").checked };
  }

  // 형식 검사 + 중복 검사 → 첫 번째 오류 [메시지, 입력란] 반환
  function check(p, excludeId) {
    const v = readFields(p), f = k => $(`${p}-${k}`);
    if (!v.name) return [MSG.nameEmpty, f("name")];
    if (!/^[a-zA-Z가-힣]{1,10}$/.test(v.name)) return [MSG.nameChar, f("name")];
    if (!/^\d{3}-\d{4}-\d{4}$/.test(v.phone)) return [MSG.phone, f("phone")];
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) return [MSG.email, f("email")];
    if (!SLOTS.includes(v.slot)) return [MSG.slot, f("slot")];
    if ([...v.memo].length > 100) return [MSG.memoMax, f("memo")];
    if (!v.agree) return [MSG.agree, f("agree")];
    const others = loadList().filter(x => x.id !== excludeId);
    if (others.some(x => x.phone === v.phone)) return [MSG.phoneDup, f("phone")];
    if (others.some(x => x.email.toLowerCase() === v.email.toLowerCase())) return [MSG.emailDup, f("email")];
    return null;
  }

  // C·U 공통 저장
  function upsert(p, existing) {
    const list = loadList(), v = readFields(p), now = new Date().toISOString();
    const entry = { id: existing?.id || newId(), code: existing?.code || newCode(list),
      name: v.name, phone: v.phone, email: v.email, slot: v.slot, memo: v.memo,
      createdAt: existing?.createdAt || now, updatedAt: now };
    const next = existing ? list.map(x => x.id === entry.id ? entry : x) : [...list, entry];
    if (!saveList(next)) popup("이 브라우저에서는 신청 내용을 저장할 수 없어 명단에 남지 않습니다.");
    return entry;
  }
  function remove(id) { saveList(loadList().filter(x => x.id !== id)); }

  function fillDl(dl, rows) {
    dl.textContent = "";
    rows.forEach(([k, v]) => {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v; dl.append(dt, dd);
    });
  }

  /* ───────── 신청하기 탭 (신청자 본인의 C·R·U·D) ───────── */
  let mine = null, justSubmitted = false;
  function renderApply() {
    // 본인 신청이 관리자에 의해 삭제·수정됐을 수 있으니 저장소 기준으로 다시 확인
    if (mine) mine = loadList().find(x => x.id === mine.id) || (storageOk ? null : mine);
    if (mine) {
      show($("applyForm"), false); show($("done"), true);
      fillDl($("summary"), [["이름", maskName(mine.name)], ["연락처", maskPhone(mine.phone)], ["이메일", maskEmail(mine.email)],
        ["희망 일정", mine.slot], ["신청 시각", fmt(mine.updatedAt)]]);
      $("code").textContent = mine.code;
      $("ticket").classList.toggle("new", justSubmitted); justSubmitted = false;
    } else {
      show($("done"), false); show($("applyForm"), true); show($("editRow"), false);
      $("submit").textContent = "신청하기";
    }
  }
  $("submit").addEventListener("click", () => {
    const bad = check("a", mine?.id); if (bad) return popup(...bad);
    mine = upsert("a", mine); justSubmitted = true; renderApply(); window.scrollTo(0, 0);
  });
  $("edit").addEventListener("click", () => {
    fillFields("a", mine); show($("done"), false); show($("applyForm"), true); show($("editRow"), true);
    $("submit").textContent = "수정 내용 저장"; $("a-name").focus();
  });
  $("cancelEdit").addEventListener("click", renderApply);
  $("withdraw").addEventListener("click", async () => {
    if (!(await ask("신청을 취소할까요? 입력한 내용이 삭제됩니다."))) return;
    remove(mine.id); mine = null; fillFields("a", null); renderApply();
  });
  $("another").addEventListener("click", () => { mine = null; fillFields("a", null); renderApply(); $("a-name").focus(); });

  /* ───────── 관리자 탭 ───────── */
  let unlocked = false, failCount = 0, lockUntil = 0;

  function renderAdmin() {
    show($("lockView"), !unlocked); show($("adminView"), unlocked);
    document.querySelector("main").classList.toggle("wide", unlocked && !$("tabAdmin").hidden);
    $("tabBtnAdmin").textContent = unlocked ? "관리자" : "관리자 🔒";
    if (unlocked) renderList(); else setTimeout(() => $("pw").focus(), 0);
  }
  $("pwBtn").addEventListener("click", () => {
    const left = lockUntil - Date.now();
    if (left > 0) return popup(`비밀번호를 ${MAX_FAIL}회 틀려 ${Math.ceil(left / 1000)}초 뒤에 다시 입력할 수 있습니다.`, $("pw"));
    const pw = $("pw").value; $("pw").value = "";
    if (!pw) return popup("비밀번호를 입력하세요.", $("pw"));
    if (sha256(pw) === ADMIN_PW_HASH) { unlocked = true; failCount = 0; renderAdmin(); return; }
    failCount++;
    if (failCount >= MAX_FAIL) { failCount = 0; lockUntil = Date.now() + LOCK_MS; popup(`비밀번호를 ${MAX_FAIL}회 틀렸습니다. 30초 뒤에 다시 입력하세요.`, $("pw")); }
    else popup(`비밀번호가 올바르지 않습니다. (${failCount}/${MAX_FAIL})`, $("pw"));
  });
  function lockAdmin() { unlocked = false; $("search").value = ""; ["viewDlg", "editDlg"].forEach(id => $(id).open && $(id).close()); }
  $("lockBtn").addEventListener("click", () => { lockAdmin(); renderAdmin(); });

  // R: 목록 (개인정보 가림 표시 + 검색)
  function renderList() {
    if (!unlocked) return;
    const all = loadList().sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    const q = $("search").value.trim().toLowerCase(), qd = q.replace(/\D/g, "");
    const list = all.map((d, i) => ({ ...d, no: i + 1 })).filter(d => !q ||
      d.name.toLowerCase().includes(q) || d.email.toLowerCase().includes(q) || d.code.toLowerCase().includes(q) ||
      (qd.length >= 4 && d.phone.replace(/\D/g, "").includes(qd)));
    const tb = $("rows"); tb.textContent = "";
    if (!list.length) {
      const tr = document.createElement("tr"), td = document.createElement("td");
      td.colSpan = 8; td.className = "empty"; td.textContent = all.length ? "검색 결과가 없습니다." : "아직 신청이 없습니다.";
      tr.append(td); tb.append(tr);
    }
    list.forEach(d => {
      const tr = document.createElement("tr");
      const LABELS = ["No", "접수 번호", "이름", "연락처", "이메일", "희망 일정", "신청 시각"];
      const NOWRAP = [0, 1, 2, 3, 6];
      [d.no, d.code, maskName(d.name), maskPhone(d.phone), maskEmail(d.email), d.slot, fmt(d.createdAt)].forEach((v, i) => {
        const td = document.createElement("td"); td.textContent = v; td.dataset.label = LABELS[i];
        td.className = "masked" + (NOWRAP.includes(i) ? " nowrap" : ""); tr.append(td);
      });
      const td = document.createElement("td"), box = document.createElement("div"); box.className = "acts"; td.className = "actcell";
      [["보기", "ghost", () => openView(d.id)], ["수정", "ghost", () => openEdit(d.id)], ["삭제", "danger", () => delOne(d.id)]]
        .forEach(([t, c, fn]) => { const b = document.createElement("button"); b.type = "button"; b.className = `${c} small`; b.textContent = t; b.addEventListener("click", fn); box.append(b); });
      td.append(box); tr.append(td); tb.append(tr);
    });
    show($("clearAll"), all.length > 0); $("csvBtn").disabled = all.length === 0;
    $("listInfo").textContent = !storageOk
      ? "이 브라우저에서는 임시 저장을 사용할 수 없어 명단을 보여 줄 수 없습니다."
      : `이 브라우저에 ${all.length}명의 신청이 임시 저장되어 있습니다.${q ? ` 검색 결과 ${list.length}건.` : ""} 개인정보는 가려서 표시합니다.`;
  }
  $("search").addEventListener("input", renderList);

  // R: 상세 보기 (기본은 가림, 버튼으로 잠시 보기)
  let viewId = null, revealed = false;
  function renderView() {
    const d = loadList().find(x => x.id === viewId); if (!d) { $("viewDlg").close(); return; }
    fillDl($("viewBody"), [["접수 번호", d.code],
      ["이름", revealed ? d.name : maskName(d.name)], ["연락처", revealed ? d.phone : maskPhone(d.phone)],
      ["이메일", revealed ? d.email : maskEmail(d.email)], ["희망 일정", d.slot], ["남기실 말", d.memo || "—"],
      ["신청 시각", fmt(d.createdAt)], ["최종 수정", fmt(d.updatedAt)]]);
    $("revealBtn").textContent = revealed ? "다시 가리기" : "개인정보 보기";
  }
  function openView(id) { viewId = id; revealed = false; renderView(); $("viewDlg").showModal(); }
  $("revealBtn").addEventListener("click", () => { revealed = !revealed; renderView(); });
  $("viewDlg").addEventListener("close", () => { revealed = false; });
  $("viewEdit").addEventListener("click", () => { const id = viewId; $("viewDlg").close(); openEdit(id); });

  // C·U: 추가·수정
  let editing = null;
  function openEdit(id) {
    editing = id ? loadList().find(x => x.id === id) || null : null;
    $("editTitle").textContent = editing ? `신청 수정 · ${editing.code}` : "신청 추가";
    fillFields("m", editing); $("editDlg").showModal(); $("m-name").focus();
  }
  $("addBtn").addEventListener("click", () => openEdit(null));
  $("editCancel").addEventListener("click", () => $("editDlg").close());
  $("editSave").addEventListener("click", () => {
    const bad = check("m", editing?.id); if (bad) return popup(...bad);
    upsert("m", editing); $("editDlg").close(); renderList(); renderApply();
  });

  // D: 삭제
  async function delOne(id) {
    const d = loadList().find(x => x.id === id); if (!d) return;
    if (!(await ask(`${maskName(d.name)}님(${d.code})의 신청을 삭제할까요?`))) return;
    remove(id); renderList(); renderApply();
  }
  $("clearAll").addEventListener("click", async () => {
    if (!(await ask("이 브라우저에 저장된 신청 명단을 모두 삭제할까요?"))) return;
    try { localStorage.removeItem(STORE_KEY); } catch {}
    renderList(); renderApply();
  });

  /* ───────── form 태그 대신 쓰는 공통 동작 ─────────
     게시된 페이지에서는 <form> 제출이 막혀 있어 버튼 클릭과 Enter 키로 직접 처리 */
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-close]"); if (!b) return;
    const d = $(b.dataset.close); if (d?.open) d.close(b.dataset.value || "");
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.isComposing || e.target.tagName === "TEXTAREA" || e.target.tagName === "BUTTON") return;
    const box = e.target.closest("[data-enter]"); if (!box) return;
    e.preventDefault(); $(box.dataset.enter).click();
  });

  /* ───────── CSV 전체 다운로드 ───────── */
  // claude.ai 게시 페이지는 downloads 기능으로, 그 밖(Netlify 등)은 브라우저 기본 다운로드로 저장
  let downloadsApi = null;
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(d => { downloadsApi = d; }).catch(() => {});
  }
  function csvCell(v) {
    let t = String(v ?? "");
    if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;            // 엑셀 수식 실행 방지
    return /[",\r\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
  }
  function buildCsv(list) {
    const head = ["No", "접수 번호", "이름", "연락처", "이메일", "희망 일정", "남기실 말", "신청 시각", "최종 수정"];
    const rows = list.map((d, i) => [i + 1, d.code, d.name, d.phone, d.email, d.slot, d.memo, fmt(d.createdAt), fmt(d.updatedAt)]);
    return "\uFEFF" + [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n"); // BOM: 엑셀 한글 깨짐 방지
  }
  $("csvBtn").addEventListener("click", async () => {
    if (!unlocked) return;
    const list = loadList().sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    if (!list.length) return popup("다운로드할 신청이 없습니다.");
    if (!(await ask(`개인정보(이름·연락처·이메일)가 가리지 않은 상태로 담긴 파일입니다. 신청 ${list.length}건을 CSV로 다운로드할까요?`))) return;
    const n = new Date(), pad = x => String(x).padStart(2, "0");
    const filename = `신청명단_${n.getFullYear()}${pad(n.getMonth() + 1)}${pad(n.getDate())}_${pad(n.getHours())}${pad(n.getMinutes())}.csv`;
    const csv = buildCsv(list);
    if (downloadsApi) {
      try { await downloadsApi.save({ filename, data: new Blob([csv], { type: "text/csv;charset=utf-8" }) }); }
      catch (e) {
        if (e?.code === "declined") return;
        popup(e?.code === "rate_limited" ? "다운로드 창이 이미 열려 있습니다. 잠시 후 다시 시도하세요." : "이 화면에서는 파일을 다운로드할 수 없습니다.");
      }
      return;
    }
    try {
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      const a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch { popup("이 화면에서는 파일을 다운로드할 수 없습니다."); }
  });

  /* ───────── 탭 전환 ───────── */
  function showTab(name) {
    const admin = name === "admin";
    $("tabApply").hidden = admin; $("tabAdmin").hidden = !admin;
    document.querySelector("main").classList.toggle("wide", admin && unlocked);
    $("tabBtnApply").setAttribute("aria-selected", String(!admin));
    $("tabBtnAdmin").setAttribute("aria-selected", String(admin));
    if (admin) renderAdmin();
    else { lockAdmin(); $("tabBtnAdmin").textContent = "관리자 🔒"; renderApply(); } // 신청하기로 돌아가면 다시 잠금
  }
  $("tabBtnApply").addEventListener("click", () => showTab("apply"));
  $("tabBtnAdmin").addEventListener("click", () => showTab("admin"));
  window.addEventListener("storage", e => { if (e.key === STORE_KEY || e.key === null) { renderList(); } });

  renderApply();
  showTab(location.hash === "#admin" ? "admin" : "apply");
})();
</script>

</body>
</html>
